name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          NODE_ENV: test
          DATABASE_URL: mongodb://127.0.0.1:27017/autoparts-test
          JWT_SECRET: test-jwt-secret
